name: Export signing credentials (one-off, encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle and encrypt credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_EXPORT_PASS: ${{ secrets.KS_EXPORT_PASS }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$KS_EXPORT_PASS"
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEY_PASSWORD=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > signing.env
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:KS_EXPORT_PASS \
            -in signing.env -out signing.env.enc
          rm signing.env
      - name: Upload encrypted credentials
        uses: actions/upload-artifact@v7
        with:
          name: signing-creds-encrypted
          path: signing.env.enc
          if-no-files-found: error
          retention-days: 1
