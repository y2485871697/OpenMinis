name: Android Build

on:
  push:
    branches:
      - feature/context-compression-model
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Prepare build customization
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build native dependencies and sandbox assets
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260813181013-1960c775504c
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Assemble debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenMinis-context-compression-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
