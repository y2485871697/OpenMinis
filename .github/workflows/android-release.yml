name: Android Stable Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Prepare build customization
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build native dependencies and sandbox assets
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Assemble stable APK
        working-directory: src/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-context-compression-stable
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error