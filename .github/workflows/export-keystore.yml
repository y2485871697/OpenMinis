name: Export signing keystore (one-off, encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and encrypt keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KS_EXPORT_PASS: ${{ secrets.KS_EXPORT_PASS }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$KS_EXPORT_PASS"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          echo "sha256: $(sha256sum keystore.jks | awk '{print $1}')"
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:KS_EXPORT_PASS \
            -in keystore.jks -out keystore.jks.enc
          rm keystore.jks
      - name: Upload encrypted keystore
        uses: actions/upload-artifact@v7
        with:
          name: keystore-encrypted
          path: keystore.jks.enc
          if-no-files-found: error
          retention-days: 1
