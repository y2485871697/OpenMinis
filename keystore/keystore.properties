# Fixed release-signing credentials for the Minis fork builds.
# Deliberately committed in plaintext: the keystore itself is public in this
# repo, so the passwords are not secrets — they exist so CI and local builds
# produce identically-signed APKs that upgrade-install over each other.
# Regenerate BOTH files together if the key is ever rotated:
#   keytool -genkeypair -v -keystore minis-fork-release.keystore -alias minisfork \
#     -keyalg RSA -keysize 4096 -validity 10950 \
#     -storepass minisfork -keypass minisfork \
#     -dname "CN=Minis Fork, OU=Fork, O=OpenMinis Fork, L=Internet, ST=Internet, C=CN"
storePassword=minisfork
keyAlias=minisfork
keyPassword=minisfork
